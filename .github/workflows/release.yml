# Replaced by the third-party fork: build packages without modifying branches or publishing as Asobo.
name: Build third-party add-on package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify package and attribution
        run: python -m unittest discover -s tests -p test_package.py -v
      - name: Build installable ZIP
        run: python scripts/build_addon.py
      - name: Write checksum
        working-directory: dist
        run: sha256sum io_scene_gltf2_msfs_2020-blender-5.3.zip > io_scene_gltf2_msfs_2020-blender-5.3.zip.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: msfs2020-blender-package
          path: dist/*
          if-no-files-found: error
